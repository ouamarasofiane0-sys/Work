<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>L'Égypte — Histoires vraies</title>
<link rel="stylesheet" href="fonts.css" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; font-family:'Patrick Hand',sans-serif; }
  #stage { position:relative; width:100vw; height:100vh; overflow:hidden; background:#f4dc80; }

  .anim { animation-play-state:paused; }
  body.go .anim { animation-play-state:running; }

  #char, .prop svg, .bg .draw { filter:url(#wob); }

  /* caméra */
  #cam { position:absolute; inset:0; z-index:1; transform-origin:50% 56%; will-change:transform; }
  .bg { position:absolute; inset:0; width:100%; height:100%; }

  #dust { position:absolute; inset:0; width:100%; height:100%; z-index:2; pointer-events:none; }
  .vignette { position:absolute; inset:0; z-index:7; pointer-events:none;
    background:radial-gradient(120% 92% at 50% 46%, rgba(0,0,0,0) 54%, rgba(70,45,5,.30) 100%); }
  .brand { position:absolute; top:2.4vh; left:0; right:0; text-align:center; z-index:8;
    font-family:'Permanent Marker'; font-size:3.2vw; letter-spacing:.04em; color:#9a6a1e; opacity:.85; }
  .bar { position:absolute; top:0; left:0; height:1vh; width:0; z-index:9; background:#c0492f;
    animation:prog 111s linear both; }
  @keyframes prog { to { width:100%; } }

  /* ---- Captions cinétiques ---- */
  #cap { position:absolute; top:6vh; left:0; right:0; z-index:6; padding:0 6vw; text-align:center;
    display:flex; flex-direction:column; align-items:center; gap:1.6vh; will-change:transform,opacity; }
  #eb { font-family:'Permanent Marker'; font-size:4.6vw; color:#fff; background:#c0492f;
    padding:.4vh 4.5vw; border-radius:2vw 3vw 2vw 3vw; box-shadow:.6vh .6vh 0 #2b2016;
    transform-origin:center; }
  #hl { font-family:'Permanent Marker'; font-size:10.5vw; line-height:1; color:#26201a;
    text-shadow:.5vh .5vh 0 rgba(255,255,255,.5); }
  #hl.big { font-size:13vw; }
  #hl span, #sb span { text-shadow:.4vh .4vh 0 rgba(255,255,255,.35); }
  #sb { font-family:'Patrick Hand'; font-size:5.4vw; color:#3f3222; line-height:1.15; max-width:90vw; }

  /* ---- Illustrations (props) ---- */
  .prop { position:absolute; z-index:5; opacity:0; animation-fill-mode:both; }
  .prop svg { width:100%; height:auto; display:block; overflow:visible; }
  .prop .inner { animation:floaty 2.9s ease-in-out infinite; transform-origin:center; }
  .prop:nth-of-type(even) .inner { animation-duration:3.4s; animation-delay:-.8s; }
  @keyframes floaty { 0%,100%{transform:translateY(0) rotate(-2deg);} 50%{transform:translateY(-16px) rotate(2deg);} }
  .plabel { margin-top:.4vh; text-align:center; font-family:'Permanent Marker'; font-size:3.2vw; color:#3f3222; }
  .slotL  { left:2vw;  top:41vh; width:30vw; }
  .slotR  { right:2vw; top:41vh; width:30vw; }
  .slotL2 { left:3vw;  top:63vh; width:25vw; }
  .slotR2 { right:3vw; top:62vh; width:25vw; }
  #s0,.t0{ animation:sc 6s 0s;}
  #s1,.t1{ animation:sc 8s 6s;}   #s2,.t2{ animation:sc 8s 14s;}  #s3,.t3{ animation:sc 8s 22s;}
  #s4,.t4{ animation:sc 8s 30s;}  #s5,.t5{ animation:sc 8s 38s;}  #s6,.t6{ animation:sc 8s 46s;}
  #s7,.t7{ animation:sc 8s 54s;}  #s8,.t8{ animation:sc 8s 62s;}  #s9,.t9{ animation:sc 8s 70s;}
  #s10,.t10{ animation:sc 8s 78s;} #s11,.t11{ animation:sc 8s 86s;} #s12,.t12{ animation:sc 9s 94s;}
  #s13,.t13{ animation:sc 8s 103s;}
  @keyframes sc {
    0%{opacity:0; transform:translateY(3vh) scale(.8) rotate(-2deg);}
    8%{opacity:1; transform:translateY(0) scale(1.06) rotate(0);}
    13%{transform:scale(1);} 90%{opacity:1; transform:scale(1);}
    100%{opacity:0; transform:translateY(-2vh) scale(.94);} }

  /* ---- Personnage ---- */
  .pharaoh { position:absolute; bottom:0; left:50%; transform:translateX(-50%); height:56vh; width:auto; z-index:4; }
  #react { animation:react 111s linear both; transform-origin:150px 505px; transform-box:view-box; }
  #sway  { animation:sway 5s ease-in-out infinite; transform-origin:150px 505px; transform-box:view-box; }
  #bob   { animation:bob 2.5s ease-in-out infinite; }
  #breathe { animation:breathe 3.4s ease-in-out infinite; transform-origin:150px 300px; transform-box:view-box; }
  #eyelids { animation:blink 4.4s infinite; transform-origin:150px 150px; transform-box:fill-box; }
  #pupils { animation:look 6s ease-in-out infinite; }
  #brows { animation:brow 3.2s ease-in-out infinite; transform-origin:150px 132px; transform-box:view-box; }
  #mouthMove { animation:talk .5s infinite; transform-origin:150px 176px; transform-box:view-box; }
  #armPoint { animation:point 2.5s ease-in-out infinite; transform-origin:184px 260px; transform-box:view-box; }
  @keyframes bob { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-12px);} }
  @keyframes sway { 0%,100%{transform:rotate(-2.4deg);} 50%{transform:rotate(2.4deg);} }
  @keyframes breathe { 0%,100%{transform:scaleY(1);} 50%{transform:scaleY(1.03);} }
  @keyframes blink { 0%,92%,100%{transform:scaleY(0);} 95%{transform:scaleY(1);} }
  @keyframes look { 0%,40%{transform:translateX(0);} 55%,75%{transform:translateX(5px);} 90%,100%{transform:translateX(0);} }
  @keyframes brow { 0%,100%{transform:translateY(0);} 45%,55%{transform:translateY(-4px);} }
  @keyframes point { 0%{transform:rotate(4deg);} 25%{transform:rotate(-14deg);} 50%{transform:rotate(-4deg);} 75%{transform:rotate(-16deg);} 100%{transform:rotate(4deg);} }
  @keyframes talk { 0%{transform:scaleY(.1);} 12%{transform:scaleY(1);} 24%{transform:scaleY(.35);} 38%{transform:scaleY(.95);} 50%{transform:scaleY(.2);} 64%{transform:scaleY(1);} 76%{transform:scaleY(.3);} 88%{transform:scaleY(.8);} 100%{transform:scaleY(.15);} }
  @keyframes react { 0%,4.5%{transform:scale(1);} 5.4%{transform:scale(1.07);} 6.5%{transform:scale(1);} 26%{transform:scale(1);} 27%{transform:scale(1.07);} 28.2%{transform:scale(1);} 47.7%{transform:scale(1);} 48.6%{transform:scale(1.07);} 49.8%{transform:scale(1);} 69.4%{transform:scale(1);} 70.3%{transform:scale(1.07);} 71.5%{transform:scale(1);} 91.9%{transform:scale(1);} 92.8%{transform:scale(1.09);} 94%{transform:scale(1);} 100%{transform:scale(1);} }

  @media (prefers-reduced-motion: reduce) { .anim{ animation-duration:.01ms !important; } }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <filter id="wob" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs></svg>

  <div id="stage">
    <div id="cam">

      <div class="prop slotR t2 anim"><div class="inner"><svg viewBox="0 0 160 200">

        <text x="65" y="115" text-anchor="middle" font-family="Bangers" font-size="40" fill="#c0492f">−30</text>
      </svg><div class="plabel">fin des pharaons</div></div></div>

      <div class="prop slotR t5 anim"><div class="inner"><svg viewBox="0 0 200 180">

      <div class="prop slotL2 t6 anim"><div class="inner"><svg viewBox="0 0 160 140">
        <g stroke="#26201a" stroke-width="5" stroke-linejoin="round" fill="#e0c06a">
          <rect x="55" y="20" width="50" height="26"/><rect x="30" y="52" width="50" height="26"/><rect x="82" y="52" width="50" height="26"/>
          <rect x="12" y="84" width="46" height="26"/><rect x="60" y="84" width="46" height="26"/><rect x="108" y="84" width="42" height="26"/></g>
        <text x="80" y="134" text-anchor="middle" font-family="Bangers" font-size="26" fill="#c0492f">2,3 millions</text></svg></div></div>

      <div class="prop slotR t7 anim"><div class="inner"><svg viewBox="0 0 160 160">

      <div class="prop slotL t8 anim"><div class="inner"><svg viewBox="0 0 170 150">

      <div class="prop slotR t9 anim"><div class="inner"><svg viewBox="0 0 170 140">
        <g stroke="#26201a" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" fill="none">

          <path d="M28 72 h26 l10 -26 l14 52 l12 -34 l8 16 h40" stroke="#c0492f" stroke-width="6"/></g></svg><div class="plabel">le pouls</div></div></div>

      <div class="prop slotR t10 anim"><div class="inner"><svg viewBox="0 0 190 210">

            <ellipse cx="76" cy="98" rx="3.5" ry="10" fill="#26201a"/><ellipse cx="114" cy="98" rx="3.5" ry="10" fill="#26201a"/></g>

        <div style="background:#c0492f;color:#fff;border:6px solid #26201a;border-radius:16px;padding:2vh 3vw;font-family:'Permanent Marker';font-size:5.6vw;text-align:center;box-shadow:.8vh .8vh 0 #26201a;transform:rotate(-2deg);">S'abonner</div>

            <g id="breathe" class="anim">
              <rect x="137" y="200" width="26" height="22" fill="#e0a45c"/>
              <path d="M118 266 Q150 254 182 266 L178 360 L122 360 Z" fill="#e0a45c"/></g>
            <path d="M130 356 L126 434 L146 434 L148 356 Z" fill="#e0a45c"/>
            <path d="M152 356 L154 434 L174 434 L170 356 Z" fill="#e0a45c"/>
            <path d="M122 434 q-6 9 7 11 l17 0 0 -11 Z" fill="#cf9a52"/>
            <path d="M178 434 q6 9 -7 11 l-17 0 0 -11 Z" fill="#cf9a52"/>
            <path d="M114 334 L186 334 L194 376 L106 376 Z" fill="#f3ead0"/>
            <g stroke="#c9bd94" stroke-width="3"><line x1="130" y1="336" x2="126" y2="374"/><line x1="150" y1="336" x2="150" y2="375"/><line x1="170" y1="336" x2="174" y2="374"/></g>
            <rect x="110" y="330" width="80" height="13" fill="#f2b632"/>
            <path d="M112 268 Q150 306 188 268 Q150 292 112 268 Z" fill="#f2b632"/>
            <path d="M118 274 Q150 304 182 274" fill="none" stroke="#2aa198" stroke-width="6"/>
            <path d="M124 280 Q150 304 176 280" fill="none" stroke="#c0492f" stroke-width="5"/>
            <path d="M122 272 Q100 304 96 344" fill="none" stroke-width="10"/>
            <g stroke-width="4"><circle cx="93" cy="356" r="8" fill="none"/><line x1="93" y1="364" x2="93" y2="384"/><line x1="83" y1="371" x2="103" y2="371"/></g>
            <g id="armPoint" class="anim">
              <path d="M180 270 Q210 252 218 214" fill="none" stroke-width="10"/>
              <circle cx="218" cy="206" r="9" fill="#e0a45c"/><line x1="218" y1="200" x2="218" y2="182" stroke-width="7"/></g>
          </g>
        </g></g></g>
      </svg>
    </div><!-- /cam -->

    <canvas id="dust" class="anim"></canvas>
    <div class="brand">1 Minute d'Histoire</div>
    <div class="bar anim"></div>

    <div id="cap"><div id="eb"></div><div id="hl"></div><div id="sb"></div></div>
    <div class="vignette"></div>
  </div>

  <script>
    // ---- données des beats (t, durée, cadrage, texte) — {r}=rouge {b}=bleu ----
    const BEATS = [
      {t:0,  d:6, shot:'wide', big:1, h:"L'Égypte antique", s:"3000 ans d'histoire — et {r}4 {r}récits qui vont te retourner le cerveau."},
      {t:6,  d:8, shot:'mid',  eb:"Cléopâtre", h:"Née trop tard", s:"À sa naissance, les pyramides ont {r}déjà {r}2500 {r}ans. Elle les visitait en touriste."},
      {t:14, d:8, shot:'close',h:"Pas égyptienne !", s:"Cléopâtre était {b}grecque — dernière dynastie née d'Alexandre le Grand."},
      {t:22, d:8, shot:'wide', h:"9 langues parlées", s:"Première de sa lignée à parler l'égyptien. Sa mort en {r}−30 clôt 3000 ans de pharaons."},
      {t:30, d:8, shot:'mid',  eb:"Les bâtisseurs", h:"Pas des esclaves", s:"On a retrouvé leurs villages et leurs tombes, {r}juste {r}à {r}côté de celles des rois."},
      {t:38, d:8, shot:'close',h:"Payés en bière", s:"Pain et bière chaque jour — jusqu'à {r}4 {r}litres {r}par {r}jour."},
      {t:46, d:8, shot:'wide', h:"2,3 millions de blocs", s:"{r}2,5 {r}tonnes chacun, empilés en 20 ans. Sans roue, ni fer, ni poulie."},
      {t:54, d:8, shot:'mid',  eb:"En avance sur tout", h:"365 jours", s:"Il y a 4000 ans, déjà {r}notre {r}calendrier : 12 mois, 365 jours."},
      {t:62, d:8, shot:'close',h:"Ils ont tout inventé", s:"Papyrus, encre, serrure, dentifrice… et le premier {r}test {r}de {r}grossesse."},
      {t:70, d:8, shot:'wide', h:"Médecins géniaux", s:"Ils recousaient les plaies et lisaient le pouls, {r}2000 {r}ans avant les Grecs."},
      {t:78, d:8, shot:'mid',  eb:"Les chats sacrés", h:"Protégés d'une déesse", s:"Tuer un chat, même par accident, était puni {r}de {r}mort."},
      {t:86, d:8, shot:'close',h:"Deuil rasé", s:"À la mort du chat, on se rasait {r}les {r}sourcils… puis on le momifiait."},
      {t:94, d:9, shot:'mid',  h:"Vaincus par des chats", s:"En −525, les Perses peignent des chats sur leurs boucliers. L'Égypte {r}refuse {r}de {r}se {r}battre."},
      {t:103,d:8, shot:'wide', big:1, h:"Et c'est rien !", s:"3000 ans à explorer. {r}Abonne-toi — demain, un nouveau pays."},
    ];

    const cam=document.getElementById('cam'), cap=document.getElementById('cap'),
          eb=document.getElementById('eb'), hl=document.getElementById('hl'), sb=document.getElementById('sb');
    const clamp=(v,a,b)=>v<a?a:v>b?b:v;
    const eob=x=>{ const c1=1.70158,c3=c1+1; return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2); };
    function activeBeat(ms){ let i=0; for(let k=0;k<BEATS.length;k++){ if(BEATS[k].t<=ms) i=k; } return i; }

    function buildLine(el, text, startT, stag, lt){
      const words=text.split(' '); let html='';
      for(let i=0;i<words.length;i++){ let w=words[i], c='inherit';
        if(w.startsWith('{r}')){c='#c0492f';w=w.slice(3);} else if(w.startsWith('{b}')){c='#2f6fb0';w=w.slice(3);}
        const p=clamp((lt-(startT+i*stag))/0.3,0,1), e=eob(p);
        const op=clamp(p*1.4,0,1), ty=(1-e)*26, scl=0.5+0.5*e;
        html+='<span style="display:inline-block;opacity:'+op.toFixed(3)+';transform:translateY('+ty.toFixed(1)+'px) scale('+scl.toFixed(3)+');color:'+c+'">'+w+'</span>&nbsp;';
      }
      el.innerHTML=html; return startT + words.length*stag + 0.3;
    }

    function camera(B, i, lt){
      const base = B.shot==='close'?1.34 : B.shot==='mid'?1.18 : 1.0;
      const punch = 0.10*Math.max(0,1-lt/0.5);
      const amp = B.shot==='wide'?2:6;
      const dx = Math.sin(lt*0.5)*amp, dy = Math.cos(lt*0.4)*amp*0.7;
      const dir = (i%2)? -1:1;
      const whip = dir*70*Math.max(0,1-lt/0.26);
      const shake = lt<0.14? Math.sin(lt*95)*6*(1-lt/0.14):0;
      cam.style.transform='translate('+(dx+whip+shake).toFixed(1)+'px,'+dy.toFixed(1)+'px) scale('+(base+punch).toFixed(3)+')';
    }

    function render(ms){
      const sec=ms/1000;
      const i=activeBeat(sec), B=BEATS[i], lt=sec - B.t;
      camera(B,i,lt);
      if(B.eb){ eb.style.display='block'; const p=clamp(lt/0.35,0,1),e=eob(p);
        eb.textContent=B.eb; eb.style.opacity=clamp(p*1.5,0,1); eb.style.transform='scale('+(0.6+0.4*e).toFixed(3)+') rotate(-2deg)'; }
      else eb.style.display='none';
      hl.className = B.big?'big':'';
      const hlEnd=buildLine(hl,B.h,0.12,0.07,lt);
      buildLine(sb,B.s,hlEnd-0.05,0.032,lt);
      let capOp=1, capY=0, capScale=1;
      if(lt> B.d-0.45){ const fo=clamp((B.d-lt)/0.45,0,1); capOp=fo; capY=(1-fo)*-26; capScale=0.95+0.05*fo; }
      let sh=0; if(lt<0.14) sh=Math.sin(lt*100)*5*(1-lt/0.14);
      cap.style.opacity=capOp.toFixed(3);
      cap.style.transform='translate(0,'+(capY+sh).toFixed(1)+'px) scale('+capScale.toFixed(3)+')';
    }

    // poussière
    const cv=document.getElementById('dust'), cx=cv.getContext('2d');
    let W=cv.width=1080, H=cv.height=1920, parts=[];
    for(let i=0;i<58;i++) parts.push({x0:Math.random()*W,y0:Math.random()*H,r:Math.random()*3+1,vy:(Math.random()*22+8),vx:(Math.random()-0.5)*16,a:Math.random()*0.5+0.2,phase:Math.random()*6.28});
    const wrap=(v,m)=>((v%m)+m)%m;
    function drawDust(t){ cx.clearRect(0,0,W,H); for(const p of parts){ const y=wrap(p.y0-p.vy*t,H+10),x=wrap(p.x0+p.vx*t,W+10);
      const a=p.a*(0.6+0.4*Math.sin(p.phase+t*2)); cx.beginPath(); cx.arc(x,y,p.r,0,7); cx.fillStyle='rgba(255,228,150,'+a+')'; cx.fill(); } }

    const FRAMES=new URLSearchParams(location.search).has('frames');
    const fontsReady=(document.fonts&&document.fonts.ready)?document.fonts.ready:Promise.resolve();
    if(FRAMES){ fontsReady.then(()=>{ document.body.classList.add('go');
      const anims=document.getAnimations(); anims.forEach(a=>a.pause());
      window.__seek=(ms)=>{ anims.forEach(a=>{a.currentTime=ms;}); render(ms); drawDust(ms/1000); };
      window.__seek(0); window.__ready=true; });
    } else { fontsReady.then(()=> requestAnimationFrame(()=>{ document.body.classList.add('go');
      const start=performance.now();
      (function loop(now){ const ms=now-start; render(ms); drawDust(ms/1000); requestAnimationFrame(loop); })(start); })); }
  </script>
</body>
