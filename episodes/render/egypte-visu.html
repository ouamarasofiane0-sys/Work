<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Visu — L'Égypte</title>
<link rel="stylesheet" href="fonts.css" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; }
  #poster { position:relative; width:100vw; height:100vh; background:#f4dc80; overflow:hidden;
    font-family:'Patrick Hand',sans-serif; }
  .ink { filter:url(#wob); }

  .bg { position:absolute; inset:0; width:100%; height:100%; }
  .vignette { position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(120% 92% at 50% 46%, rgba(0,0,0,0) 55%, rgba(70,45,5,.28) 100%); }

  .badge { position:absolute; top:40px; left:50%; transform:translateX(-50%) rotate(-2deg); z-index:5;
    font-family:'Permanent Marker'; font-size:34px; color:#fff; background:#26201a;
    padding:10px 34px; border-radius:16px 26px 16px 26px; box-shadow:6px 6px 0 rgba(0,0,0,.25); }

  .title { position:absolute; top:120px; left:0; right:0; text-align:center; z-index:5;
    font-family:'Permanent Marker'; color:#c0492f; font-size:200px; line-height:.9;
    text-shadow:8px 8px 0 #26201a, 0 0 0 #fff; letter-spacing:2px; }
  .title .l2 { display:block; color:#2f6fb0; font-size:96px; -webkit-text-stroke:0; }
  .subtitle { position:absolute; top:420px; left:0; right:0; text-align:center; z-index:5;
    font-family:'Patrick Hand'; font-size:46px; color:#3f3222; }

  .prop { position:absolute; z-index:4; }
  .prop svg { width:100%; height:auto; display:block; overflow:visible; }
  .p-pyr { left:40px;  top:560px; width:240px; transform:rotate(-4deg); }
  .p-cat { right:10px; top:560px; width:240px; transform:rotate(4deg); }
  .p-ankh{ left:70px;  top:1060px; width:110px; transform:rotate(-8deg); }
  .p-beer{ right:55px; top:1050px; width:150px; transform:rotate(6deg); }

  .pharaoh { position:absolute; bottom:-20px; left:50%; transform:translateX(-50%); height:820px; width:auto; z-index:6; }

  .plabel { margin-top:6px; text-align:center; font-family:'Permanent Marker'; font-size:26px; color:#3f3222; }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute"><defs>
    <filter id="wob" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs></svg>

  <div id="poster">
    <!-- décor -->
    <svg class="bg ink" viewBox="0 0 108 135" preserveAspectRatio="xMidYMid slice">
      <rect width="108" height="135" fill="#f4dc80"/>
      <g stroke="#26201a" stroke-linejoin="round">
        <circle cx="97" cy="14" r="8.5" fill="#ffd23f" stroke-width="1.2"/>
        <polygon points="18,66 -2,100 38,100" fill="#e8c559" stroke-width="1.2"/>
        <polygon points="90,72 66,100 112,100" fill="#e8c559" stroke-width="1.2"/>
        <polygon points="54,44 24,100 84,100" fill="#eccf6b" stroke-width="1.4"/>
        <line x1="54" y1="44" x2="54" y2="100" stroke="#c9a94e" stroke-width=".9"/>
        <line x1="-2" y1="100" x2="112" y2="100" stroke-width="1.2"/>
      </g>
      <rect x="0" y="100" width="108" height="35" fill="#e6c862"/>
    </svg>

    <div class="badge">1 Minute d'Histoire</div>
    <div class="title">L'Égypte<span class="l2">l'Histoire en doodle</span></div>
    <div class="subtitle">Des récits fous, racontés en 1 minute</div>

    <!-- props -->
    <div class="prop p-ankh"><svg class="ink" viewBox="0 0 120 160">
      <g stroke="#26201a" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" fill="#f2b632">
        <circle cx="60" cy="40" r="24" fill="none"/><line x1="60" y1="64" x2="60" y2="140"/><line x1="30" y1="88" x2="90" y2="88"/>
      </g></svg></div>

    <div class="prop p-beer"><svg class="ink" viewBox="0 0 200 180">
      <g stroke="#26201a" stroke-width="7" stroke-linejoin="round">
        <rect x="30" y="55" width="70" height="110" rx="8" fill="#f2b134"/>
        <path d="M100 75 q34 0 34 32 q0 30 -34 30" fill="none"/>
        <ellipse cx="65" cy="52" rx="42" ry="18" fill="#fff8ec"/>
        <circle cx="45" cy="44" r="12" fill="#fff8ec"/><circle cx="70" cy="40" r="14" fill="#fff8ec"/><circle cx="90" cy="46" r="11" fill="#fff8ec"/>
      </g></svg></div>

    <div class="prop p-pyr"><svg class="ink" viewBox="0 0 200 170">
      <polygon points="100,20 20,150 180,150" fill="#eccf6b" stroke="#26201a" stroke-width="7" stroke-linejoin="round"/>
      <polygon points="100,20 78,55 122,55" fill="#fff6d8" stroke="#26201a" stroke-width="4"/>
      <line x1="100" y1="20" x2="60" y2="150" stroke="#c99a3a" stroke-width="3"/><line x1="100" y1="20" x2="140" y2="150" stroke="#c99a3a" stroke-width="3"/>
    </svg><div class="plabel">4500 ans</div></div>

    <div class="prop p-cat"><svg class="ink" viewBox="0 0 190 210">
      <g stroke="#26201a" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
        <path d="M60 40 L48 4 L86 32 Z" fill="#26201a"/><path d="M130 40 L142 4 L104 32 Z" fill="#26201a"/>
        <path d="M40 120 Q40 40 95 40 Q150 40 150 120 Q150 190 95 190 Q40 190 40 120 Z" fill="#26201a"/>
        <path d="M150 150 q34 6 22 -40 q-10 26 -22 20" fill="#26201a"/>
        <g stroke="none"><ellipse cx="76" cy="96" rx="9" ry="13" fill="#f2b632"/><ellipse cx="114" cy="96" rx="9" ry="13" fill="#f2b632"/>
          <ellipse cx="76" cy="98" rx="3.5" ry="10" fill="#26201a"/><ellipse cx="114" cy="98" rx="3.5" ry="10" fill="#26201a"/></g>
        <path d="M95 112 l-6 8 l12 0 Z" fill="#e6a5a0" stroke-width="3"/>
        <path d="M95 120 l0 8 M95 128 q-10 4 -16 -2 M95 128 q10 4 16 -2" fill="none" stroke-width="3"/>
        <path d="M60 118 l-30 -6 M60 128 l-30 4 M130 118 l30 -6 M130 128 l30 4" stroke-width="3"/>
        <path d="M60 150 Q95 178 130 150 L130 172 Q95 190 60 172 Z" fill="#f2b632"/>
      </g></svg><div class="plabel">sacré</div></div>

    <!-- pharaon -->
    <svg class="pharaoh ink" viewBox="0 0 300 520">
      <ellipse cx="150" cy="508" rx="80" ry="13" fill="rgba(70,45,5,.18)"/>
      <g stroke="#26201a" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
        <path d="M102 128 Q150 50 198 128 Z" fill="#f2b632"/>
        <path d="M110 116 L86 264 L130 264 L131 150 Z" fill="#f2b632"/>
        <path d="M190 116 L214 264 L170 264 L169 150 Z" fill="#f2b632"/>
        <g stroke="#2f6fb0" stroke-width="4">
          <line x1="114" y1="152" x2="127" y2="152"/><line x1="110" y1="184" x2="126" y2="184"/>
          <line x1="104" y1="216" x2="124" y2="216"/><line x1="99" y1="248" x2="122" y2="248"/>
          <line x1="186" y1="152" x2="173" y2="152"/><line x1="190" y1="184" x2="174" y2="184"/>
          <line x1="196" y1="216" x2="176" y2="216"/><line x1="201" y1="248" x2="178" y2="248"/>
          <line x1="118" y1="94" x2="182" y2="94"/>
        </g>
        <path d="M106 120 Q150 98 194 120 L189 136 Q150 114 111 136 Z" fill="#2f6fb0"/>
        <path d="M113 122 Q150 110 187 122 L185 196 Q150 220 115 196 Z" fill="#e0a45c"/>
        <path d="M150 116 q-9 -11 0 -20 q9 7 0 16" fill="#2f9d6a" stroke-width="4"/>
        <circle cx="150" cy="97" r="4" fill="#c0492f" stroke-width="3"/>
        <g stroke-width="5"><path d="M120 132 q11 -7 22 -2" fill="none"/><path d="M180 132 q-11 -7 -22 -2" fill="none"/></g>
        <g><ellipse cx="132" cy="150" rx="12" ry="14" fill="#fff"/><ellipse cx="168" cy="150" rx="12" ry="14" fill="#fff"/></g>
        <g stroke="none" fill="#26201a"><ellipse cx="135" cy="151" rx="5.5" ry="7"/><ellipse cx="171" cy="151" rx="5.5" ry="7"/></g>
        <path d="M150 158 q-5 9 -1 15 q3 2 6 0" fill="none" stroke-width="4"/>
        <g>
          <path d="M126 174 Q150 170 174 174" fill="none" stroke-width="5"/>
          <path d="M129 176 Q150 174 171 176 Q150 210 129 176 Z" fill="#7a2a1e" stroke="none"/>
          <ellipse cx="150" cy="198" rx="11" ry="5" fill="#d46a5a" stroke="none"/>
          <rect x="134" y="175" width="32" height="5" rx="2" fill="#fff" stroke="none"/>
        </g>
        <path d="M141 214 L138 268 Q150 282 162 268 L159 214 Q150 220 141 214 Z" fill="#2f6fb0"/>
        <g stroke="#1c3f73" stroke-width="3"><line x1="140" y1="230" x2="160" y2="230"/><line x1="139" y1="246" x2="161" y2="246"/><line x1="139" y1="262" x2="161" y2="262"/></g>
        <rect x="137" y="200" width="26" height="22" fill="#e0a45c"/>
        <path d="M118 266 Q150 254 182 266 L178 360 L122 360 Z" fill="#e0a45c"/>
        <path d="M130 356 L126 434 L146 434 L148 356 Z" fill="#e0a45c"/>
        <path d="M152 356 L154 434 L174 434 L170 356 Z" fill="#e0a45c"/>
        <path d="M122 434 q-6 9 7 11 l17 0 0 -11 Z" fill="#cf9a52"/>
        <path d="M178 434 q6 9 -7 11 l-17 0 0 -11 Z" fill="#cf9a52"/>
        <path d="M114 334 L186 334 L194 376 L106 376 Z" fill="#f3ead0"/>
        <g stroke="#c9bd94" stroke-width="3"><line x1="130" y1="336" x2="126" y2="374"/><line x1="150" y1="336" x2="150" y2="375"/><line x1="170" y1="336" x2="174" y2="374"/></g>
        <rect x="110" y="330" width="80" height="13" fill="#f2b632"/>
        <path d="M112 268 Q150 306 188 268 Q150 292 112 268 Z" fill="#f2b632"/>
        <path d="M118 274 Q150 304 182 274" fill="none" stroke="#2aa198" stroke-width="6"/>
        <path d="M124 280 Q150 304 176 280" fill="none" stroke="#c0492f" stroke-width="5"/>
        <!-- bras qui salue -->
        <path d="M122 272 Q98 250 108 214" fill="none" stroke-width="10"/>
        <circle cx="108" cy="206" r="9" fill="#e0a45c"/>
        <path d="M180 270 Q210 252 214 216" fill="none" stroke-width="10"/>
        <circle cx="214" cy="208" r="9" fill="#e0a45c"/>
        <line x1="214" y1="202" x2="214" y2="184" stroke-width="7"/>
      </g>
    </svg>

    <div class="vignette"></div>
  </div>
</body>
</html>
